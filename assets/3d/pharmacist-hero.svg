<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none">
  <defs>
    <radialGradient id="haloGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="70%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F5F7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFDCC8"/>
      <stop offset="65%" stop-color="#F7BEA0"/>
      <stop offset="100%" stop-color="#E29B78"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5FF"/>
      <stop offset="100%" stop-color="#DCE4F7"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4965F5"/>
      <stop offset="100%" stop-color="#344FD8"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2F6F"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="capsuleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D83F8"/>
      <stop offset="100%" stop-color="#4965F5"/>
    </linearGradient>
    <linearGradient id="capsuleCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A8E"/>
      <stop offset="100%" stop-color="#FF7A6B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172554" flood-opacity="0.14"/>
    </filter>
    <filter id="miniShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#172554" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Pastel Backdrop -->
  <circle cx="160" cy="152" r="132" fill="url(#haloGrad)"/>
  <ellipse cx="160" cy="266" rx="88" ry="14" fill="#CBD5E1" opacity="0.45"/>

  <!-- Floating 3D Medical Cross (Top Left) -->
  <g filter="url(#miniShadow)" transform="translate(36, 48) rotate(-10)">
    <rect x="0" y="0" width="38" height="38" rx="11" fill="#FFFFFF"/>
    <rect x="15" y="8" width="8" height="22" rx="4" fill="#14B8A6"/>
    <rect x="8" y="15" width="22" height="8" rx="4" fill="#14B8A6"/>
  </g>

  <!-- Floating 3D Capsule (Top Right) -->
  <g filter="url(#miniShadow)" transform="translate(242, 66) rotate(28)">
    <rect x="0" y="0" width="22" height="44" rx="11" fill="url(#capsuleCoral)"/>
    <path d="M0 22 H22 V33 A11 11 0 0 1 0 33 Z" fill="#FFFFFF"/>
    <ellipse cx="7" cy="11" rx="3" ry="6" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Main Pharmacist Character -->
  <g filter="url(#softShadow)">
    <!-- Neck -->
    <rect x="145" y="126" width="30" height="24" rx="12" fill="url(#skinGrad)"/>

    <!-- Inner Shirt -->
    <path d="M122 146 Q160 138 198 146 L208 242 H112 Z" fill="url(#shirtGrad)"/>

    <!-- White Medical Coat -->
    <path d="M98 156 C104 140 124 136 142 140 L160 198 L178 140 C196 136 216 140 222 156 L234 252 C235 260 228 266 220 266 H100 C92 266 85 260 86 252 Z" fill="url(#coatGrad)"/>

    <!-- Coat Lapels -->
    <path d="M138 140 L160 198 L130 182 Z" fill="#E8EEFA"/>
    <path d="M182 140 L160 198 L190 182 Z" fill="#E8EEFA"/>

    <!-- Coat Pocket + Pen -->
    <rect x="184" y="196" width="26" height="24" rx="5" fill="#E8EEFA"/>
    <rect x="193" y="188" width="4" height="12" rx="2" fill="#4965F5"/>

    <!-- Teal Stethoscope -->
    <path d="M132 144 C124 174 132 204 160 204 C188 204 196 174 188 144" stroke="#14B8A6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="212" r="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="3.5"/>
    <circle cx="160" cy="212" r="4" fill="#14B8A6"/>

    <!-- Head -->
    <rect x="122" y="54" width="76" height="82" rx="38" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <circle cx="121" cy="96" r="9" fill="#F2B293"/>
    <circle cx="199" cy="96" r="9" fill="#F2B293"/>

    <!-- Hair -->
    <path d="M120 88 C118 52 142 40 164 40 C190 40 202 58 200 88 C194 70 182 62 162 64 C142 66 130 70 120 88 Z" fill="url(#hairGrad)"/>

    <!-- Eyes & Friendly Smile -->
    <circle cx="144" cy="94" r="4.5" fill="#172554"/>
    <circle cx="176" cy="94" r="4.5" fill="#172554"/>
    <circle cx="145.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="177.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="136" cy="105" rx="6" ry="3.5" fill="#FF7A6B" opacity="0.35"/>
    <ellipse cx="184" cy="105" rx="6" ry="3.5" fill="#FF7A6B" opacity="0.35"/>
    <path d="M148 110 Q160 120 172 110" stroke="#172554" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Arms holding Tablet -->
    <path d="M96 178 C88 202 98 220 118 222" stroke="url(#coatGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M224 178 C232 202 222 220 202 222" stroke="url(#coatGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Digital Tablet -->
    <g transform="translate(114, 200) rotate(-3)">
      <rect x="0" y="0" width="92" height="62" rx="10" fill="url(#tabletGrad)"/>
      <rect x="5" y="5" width="82" height="52" rx="7" fill="#EEF2FF"/>
      <rect x="13" y="14" width="26" height="26" rx="7" fill="#14B8A6"/>
      <rect x="23" y="19" width="6" height="16" rx="3" fill="#FFFFFF"/>
      <rect x="18" y="24" width="16" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="46" y="16" width="32" height="6" rx="3" fill="#4965F5"/>
      <rect x="46" y="27" width="24" height="5" rx="2.5" fill="#9274F3" opacity="0.7"/>
      <rect x="13" y="45" width="65" height="5" rx="2.5" fill="#CBD5E1"/>
    </g>

    <!-- Hands -->
    <circle cx="114" cy="226" r="9" fill="url(#skinGrad)"/>
    <circle cx="206" cy="224" r="9" fill="url(#skinGrad)"/>
  </g>
</svg>
